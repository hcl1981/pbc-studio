<script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/12.3.1/blockly_compressed.js"></script>

<!-- Blockly's built-in blocks (if / repeat / while / for / comparisons /
     math / variables ...) take their text from Blockly.Msg, which is empty
     until a message pack is loaded -- without one the blocks show raw
     %{BKY_...} placeholders. German is the default language, so we load
     de.js as a normal (static) parser-blocking <script>. Loading it this
     way -- rather than via document.write -- avoids Chrome's "parser-
     blocking cross-site script invoked via document.write" intervention
     warning (and the chance the pack gets dropped on a flaky connection)
     for the common case, while still guaranteeing the locale is set
     before the block definitions in the main script run. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/12.3.1/msg/de.js"></script>
<script>
/* English is the only non-default language. When it's selected we pull
   en.js on top of the German pack; it overrides the same Blockly.Msg
   keys. This rarer case still uses document.write so it stays in order
   ahead of the block definitions. Key must match LANG_KEY ('pbc.lang'). */
(function () {
  var lang = 'de';
  try { lang = localStorage.getItem('pbc.lang') || 'de'; } catch (e) {}
  if (lang === 'en') {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/12.3.1/msg/en.js"><\/script>');
  }
})();
</script>
